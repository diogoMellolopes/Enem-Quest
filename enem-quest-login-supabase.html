<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENEM Quest – Login</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--tx:#1d1a2e;--mut:#6b6785;--bd:#ddd8f0;--pri:#6c3df4;--pri2:#9a6bff;--ok:#12805c;--err:#c62839;--inp:#faf9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#14112a;--card:#1e1a3a;--tx:#f0edff;--mut:#a8a3c8;--bd:#352f5e;--pri:#8a62ff;--pri2:#b08cff;--ok:#4fd1a0;--err:#ff7a88;--inp:#17132f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px}
.logo{text-align:center;margin:8px 0 20px}
.mark{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;box-shadow:0 8px 24px rgba(108,61,244,.35)}
.logo h1{margin:0;font-size:26px}.logo p{margin:4px 0 0;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px}
h2{margin:0 0 16px;font-size:20px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.f{position:relative}
input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--bd);background:var(--inp);color:var(--tx);padding:0 14px;font-size:16px;outline:none}
input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(138,98,255,.25)}
input.bad{border-color:var(--err)}
.eye{position:absolute;right:6px;top:4px;height:40px;min-width:44px;border:0;background:none;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.err{color:var(--err);font-size:13px;margin-top:4px}
.msg{margin-top:14px;padding:10px 12px;border-radius:12px;font-size:14px;display:none}
.msg.e{display:block;background:rgba(198,40,57,.12);color:var(--err)}
.msg.o{display:block;background:rgba(18,128,92,.14);color:var(--ok)}
.btn{width:100%;height:50px;border-radius:14px;border:0;font-size:16px;font-weight:700;cursor:pointer;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.btn.g{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);margin-top:10px}
.btn.s{height:44px;margin-top:12px;background:none;border:1.5px solid var(--bd);color:var(--tx)}
.btn:disabled{opacity:.6;cursor:wait}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin-top:16px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.alt{text-align:center;margin:18px 0 0;font-size:14px;color:var(--mut)}
.alt a{color:var(--pri);font-weight:700;text-decoration:none}
.gl{width:20px;height:20px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0)}
.hide{display:none}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:360px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600}
</style>
</head>
<body>
<main>
<div class="logo"><div class="mark">EQ</div><h1>ENEM Quest</h1><p>Estude jogando. Desafie seus amigos.</p></div>

<section id="v-login" class="card hide">
<h2>Entrar</h2>
<form id="fl" novalidate>
<label for="le">E-mail</label><input id="le" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com"><div class="err" data-for="le"></div>
<label for="ls">Senha</label><div class="f"><input id="ls" type="password" autocomplete="current-password" placeholder="Sua senha"><button type="button" class="eye" data-eye="ls">Mostrar</button></div><div class="err" data-for="ls"></div>
<div id="ml" class="msg" role="alert"></div>
<button class="btn p" type="submit">Entrar</button>
</form>
<div class="or">ou</div>
<button class="btn g" data-google data-out="ml"><span class="gl"></span>Entrar com o Google</button>
<p class="alt">Ainda não tem conta? <a href="#cadastro">Cadastre-se</a></p>
</section>

<section id="v-cadastro" class="card hide">
<h2>Criar conta</h2>
<form id="fc" novalidate>
<label for="cn">Nome</label><input id="cn" maxlength="50" autocomplete="name" placeholder="Seu nome"><div class="err" data-for="cn"></div>
<label for="ce">E-mail</label><input id="ce" type="email" maxlength="100" autocomplete="email" inputmode="email" placeholder="voce@email.com"><div class="err" data-for="ce"></div>
<label for="cs">Senha</label><div class="f"><input id="cs" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"><button type="button" class="eye" data-eye="cs">Mostrar</button></div><div class="err" data-for="cs"></div>
<label for="cc">Confirmar senha</label><div class="f"><input id="cc" type="password" autocomplete="new-password" placeholder="Repita a senha"><button type="button" class="eye" data-eye="cc">Mostrar</button></div><div class="err" data-for="cc"></div>
<div id="mc" class="msg" role="alert"></div>
<button class="btn p" type="submit">Cadastrar</button>
</form>
<div class="or">ou</div>
<button class="btn g" data-google data-out="mc"><span class="gl"></span>Cadastrar com o Google</button>
<p class="alt">Já tem conta? <a href="#login">Entrar</a></p>
</section>

<section id="v-home" class="card hide">
<h2>Olá, <span id="hn"></span>!</h2>
<p style="color:var(--mut);margin:0">Login realizado. O Painel do Jogador entra na Sprint 5.</p>
<button id="out" class="btn s">Sair</button>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== CONFIG: somente a chave PUBLISHABLE. Nunca coloque a sb_secret aqui. ===== */
const SUPABASE_URL = "https://vfdrdcdjhjlkzhibyyus.supabase.co";
const SUPABASE_KEY = "sb_publishable_CBN105HJL2qxD0YRRSpXWw_kbfSCs8K";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const p2 = n => String(n).padStart(2, "0");
const hoje = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const agora = d => p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
const LOGKEY = "eq_logid";
const store = { get(){ try{ return localStorage.getItem(LOGKEY); }catch(e){ return null; } },
                set(v){ try{ v ? localStorage.setItem(LOGKEY, v) : localStorage.removeItem(LOGKEY); }catch(e){} } };

/* ===== UsuarioService ===== */
const UsuarioService = {
  async perfil(){
    const { data: { user } } = await sb.auth.getUser();
    if(!user) return null;
    const { data, error } = await sb.from("User").select("UserID,Nome,Email").eq("auth_id", user.id).maybeSingle();
    if(error) throw error;
    if(data) return data;
    /* perfil ausente (conta antiga ou trigger que falhou): cria agora */
    const meta = user.user_metadata || {};
    const nome = (meta.nome || meta.full_name || (user.email || "").split("@")[0]).slice(0, 50);
    const { data: novo, error: e2 } = await sb.from("User")
      .insert({ Email: user.email, Nome: nome, Registro: hoje(new Date()), auth_id: user.id })
      .select("UserID,Nome,Email").single();
    if(e2) throw e2;
    return novo;
  },
  cadastrar(nome, email, senha){ return sb.auth.signUp({ email, password: senha, options: { data: { nome } } }); },
  entrar(email, senha){ return sb.auth.signInWithPassword({ email, password: senha }); },
  google(){ return sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } }); },
  sair(){ return sb.auth.signOut(); }
};

/* ===== LogService (tabela Logs: data/hora de login e logout separadas) ===== */
const LogService = {
  async abrir(p){
    const d = new Date();
    const { data, error } = await sb.from("Logs").insert({
      UserID: p.UserID, nomeUsuario: (p.Nome || p.Email || "").slice(0, 50),
      data_login: hoje(d), hora_login: agora(d)
    }).select("LogID").single();
    if(error) throw error;
    store.set(String(data.LogID));
  },
  async garantirAberto(p){
    if(store.get()) return;
    await this.abrir(p);
  },
  async fechar(p){
    const d = new Date(), campos = { data_logout: hoje(d), hora_logout: agora(d) };
    let id = store.get();
    if(!id){ /* sessão perdida: fecha o último log aberto do usuário */
      const { data } = await sb.from("Logs").select("LogID").eq("UserID", p.UserID).is("data_logout", null).order("LogID", { ascending: false }).limit(1);
      id = data && data[0] ? data[0].LogID : null;
    }
    if(id) await sb.from("Logs").update(campos).eq("LogID", id);
    store.set(null);
  },
  async recentes(p){
    const { data } = await sb.from("Logs").select("data_login,hora_login,data_logout,hora_logout").eq("UserID", p.UserID).order("LogID", { ascending: false }).limit(8);
    return data || [];
  }
};

/* ===== UI ===== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const br = (d, h) => d ? d.split("-").reverse().slice(0, 2).join("/") + " " + (h || "").slice(0, 5) : "Em sessão";
function setErr(id, t){ $('[data-for="' + id + '"]').textContent = t || ""; $("#" + id).classList.toggle("bad", !!t); }
function msg(id, t, tipo){ const m = $("#" + id); m.textContent = t || ""; m.className = "msg" + (t ? " " + tipo : ""); }
function traduzir(e){
  const m = (e && e.message) || "Erro inesperado.";
  if(/invalid login/i.test(m)) return "E-mail ou senha incorretos.";
  if(/already registered/i.test(m)) return "Este e-mail já está cadastrado.";
  if(/email not confirmed/i.test(m)) return "Confirme seu e-mail antes de entrar.";
  if(/rate limit|too many|security purposes/i.test(m)) return "Limite de tentativas do Supabase atingido. Aguarde alguns minutos. (Detalhe: " + m + ")";
  return m;
}

let perfilAtual = null, cadastrando = false;
async function route(){
  if(cadastrando) return;
  const { data: { session } } = await sb.auth.getSession();
  let h = location.hash.slice(1);
  if(session){
    try{
      perfilAtual = await UsuarioService.perfil();
      if(!perfilAtual) throw new Error("Perfil não encontrado na tabela User. Rode o SQL do trigger no Supabase.");
      await LogService.garantirAberto(perfilAtual); h = "home";
    }catch(e){
      console.error(e); h = "login";
      msg("ml", "Erro ao carregar sua conta: " + (e.message || JSON.stringify(e)), "e");
    }
  } else { perfilAtual = null; store.set(null); }
  if(h !== "home") h = h === "cadastro" ? "cadastro" : "login";
  $$("section").forEach(s => s.classList.add("hide"));
  $("#v-" + h).classList.remove("hide");
  if(h === "home"){
    $("#hn").textContent = perfilAtual.Nome || perfilAtual.Email;
  }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
/* OAuth (Google) volta para a página e dispara SIGNED_IN; adiar a chamada evita deadlock do supabase-js */
sb.auth.onAuthStateChange(ev => { if(ev === "SIGNED_IN" || ev === "SIGNED_OUT") setTimeout(route, 0); });

$$("[data-eye]").forEach(b => b.onclick = () => {
  const i = $("#" + b.dataset.eye), s = i.type === "password";
  i.type = s ? "text" : "password"; b.textContent = s ? "Ocultar" : "Mostrar";
});

async function run(btn, out, fn){
  btn.disabled = true;
  try{ await fn(); }catch(e){ msg(out, traduzir(e), "e"); }
  finally{ btn.disabled = false; }
}

$("#fl").onsubmit = ev => {
  ev.preventDefault(); ["le","ls"].forEach(i => setErr(i, "")); msg("ml", "");
  const email = $("#le").value.trim().toLowerCase(), senha = $("#ls").value; let ok = true;
  if(!emailOk(email)){ setErr("le", "Informe um e-mail válido."); ok = false; }
  if(!senha){ setErr("ls", "Informe sua senha."); ok = false; }
  if(ok) run(ev.submitter, "ml", async () => {
    const { error } = await UsuarioService.entrar(email, senha);
    if(error) throw error;
    location.hash = ""; await route();
  });
};

$("#fc").onsubmit = ev => {
  ev.preventDefault(); ["cn","ce","cs","cc"].forEach(i => setErr(i, "")); msg("mc", "");
  const nome = $("#cn").value.trim(), email = $("#ce").value.trim().toLowerCase(), s = $("#cs").value, c = $("#cc").value; let ok = true;
  if(nome.length < 2){ setErr("cn", "Informe seu nome."); ok = false; }
  if(!emailOk(email)){ setErr("ce", "Informe um e-mail válido."); ok = false; }
  if(s.length < 6){ setErr("cs", "A senha deve ter ao menos 6 caracteres."); ok = false; }
  if(c !== s){ setErr("cc", "As senhas não coincidem."); ok = false; }
  if(ok) run(ev.submitter, "mc", async () => {
    const { data, error } = await UsuarioService.cadastrar(nome, email, s);
    if(error) throw error;
    if(data.user && data.user.identities && data.user.identities.length === 0) throw new Error("already registered");
    if(!data.session){ msg("mc", "Conta criada! Confirme seu e-mail e depois faça login.", "o"); return; }
    cadastrando = true;
    try{ await sb.auth.signOut(); store.set(null); } finally { cadastrando = false; }
    $("#fc").reset();
    location.hash = "login"; await route();
    $("#le").value = email;
    msg("ml", "Conta criada com sucesso! Faça login para continuar.", "o");
  });
};

$$("[data-google]").forEach(b => b.onclick = () => run(b, b.dataset.out, async () => {
  const { error } = await UsuarioService.google(); if(error) throw error;
}));

$("#out").onclick = async () => {
  const b = $("#out"); b.disabled = true;
  try{ if(perfilAtual) await LogService.fechar(perfilAtual); }catch(e){ console.error(e); }
  await UsuarioService.sair();
  b.disabled = false; location.hash = "login";
};

route();
</script>
</body>
</html>
